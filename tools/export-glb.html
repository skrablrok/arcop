<!DOCTYPE html><html><head><meta charset="utf-8"><title>Export ARCOP drone GLB</title></head><body style="font:16px sans-serif;padding:24px">
<!-- Rebuilds models/arcop-drone.glb from js/drone-model.js. Open over http (not file://), click the link, then optionally run:
     npx @gltf-transform/cli dedup|prune|quantize to shrink it (the shipped file is quantized, ~770 KB). -->
<script src="../vendor/three.min.js"></script><script src="../vendor/GLTFExporter.js"></script><script src="../js/drone-model.js"></script>
<script>
var d=buildArcopDrone(THREE,{textureSize:512});
new THREE.GLTFExporter().parse(d.root,function(buf){
  var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  window.glb=btoa(s);window.done=true;
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'}));a.download='arcop-drone.glb';a.textContent='Download arcop-drone.glb';document.body.appendChild(a);
},{binary:true,maxTextureSize:1024,onlyVisible:true});
</script></body></html>
